plugins {
  id 'java'
  id "io.freefair.lombok" version "6.6.2"
  id 'com.github.johnrengelman.shadow' version '7.1.2'
  id "org.gradlex.extra-java-module-info" version "1.3"
  id "com.diffplug.spotless" version "6.15.0"
}

repositories {
  mavenLocal()
  mavenCentral()
}

dependencies {
  implementation 'com.drewnoakes:metadata-extractor:2.19.0-SNAPSHOT'
  implementation 'org.slf4j:slf4j-api:2.0.6'
  implementation 'com.beust:jcommander:1.82'
  implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
  implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.20.0'
  testImplementation 'org.testng:testng:7.7.1'
  testImplementation 'org.webjars:jquery:3.6.3'
  
}
extraJavaModuleInfo {
    automaticModule("jcommander-1.82.jar", "jcommander")
    automaticModule("xmpcore-6.1.11.jar", "xmpcore")
  automaticModule("jquery-3.6.3.jar", "jquery")
  //  automaticModule("metadata-extractor-2.18.0.jar", "com.drewnoakes.metadataextractor")
}
java {
  if(rootProject.hasProperty("heavy")) {
    withSourcesJar()
    withJavadocJar()
  }
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}
test {
  useTestNG()
}
